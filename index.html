<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>正在跳转到 Design Tool Collection...</title>
  <meta http-equiv="refresh" content="0; url=https://designtool.cyou/">
  <link rel="icon" type="image/svg+xml" href="/icon.svg">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
    }
    
    .container {
      text-align: center;
      padding: 40px;
      background: white;
      border-radius: 16px;
      border: 1px solid #e0e0e0;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
      max-width: 500px;
      margin: 20px;
    }
    
    .spinner {
      width: 50px;
      height: 50px;
      border: 4px solid #f3f3f3;
      border-top: 4px solid #667eea;
      border-radius: 50%;
      margin: 0 auto 20px;
      animation: spin 1s linear infinite;
    }
    
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    
    h1 {
      color: #333;
      font-size: 24px;
      margin-bottom: 12px;
    }
    
    p {
      color: #666;
      font-size: 16px;
      margin-bottom: 20px;
    }
    
    a {
      display: inline-block;
      color: #667eea;
      background: white;
      border: 2px solid #667eea;
      padding: 12px 30px;
      border-radius: 25px;
      text-decoration: none;
      font-weight: 600;
      transition: all 0.3s;
    }
    
    a:hover {
      background: #667eea;
      color: white;
      transform: translateY(-2px);
      box-shadow: 0 5px 20px rgba(102, 126, 234, 0.3);
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="spinner"></div>
    <h1>正在跳转...</h1>
    <p>您将被自动重定向到 Design Tool Collection</p>
    <a href="https://designtool.cyou/">如果没有自动跳转，请点击这里</a>
  </div>
  
  <script>
    // 确保立即跳转
    window.location.href = "https://designtool.cyou/";
  </script>
</body>
</html>
